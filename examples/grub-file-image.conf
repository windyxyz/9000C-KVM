# =============================================================================
# "文件镜像引导" GRUB 菜单项示例
#
# 原理：宿主系统的根文件系统是某个分区目录下的磁盘镜像文件（os.img）。
# GRUB 从 /boot 加载专用内核与 initrd；内核参数携带镜像所在分区的 UUID
# 与路径，由 initrd 完成 blkid 定位 → loop 挂载 → 切换根。
#
# 部署方式：将本文件放入 /etc/grub.d/（如 50-win-vm），chmod +x 后 update-grub。
# 注意：initrd 必须包含解析以下参数并完成 loop 挂载的引导逻辑（见 docs/01）。
# =============================================================================
menuentry "WinVM Host" --id WinVMHost {
    # 内核与 initrd 位于 /boot 分区（search 按 UUID 定位）
    search --no-floppy --fs-uuid --set=root <BOOT分区UUID>

    linux /vmlinuz \
        rootimg_uuid=<os.img所在分区UUID> \
        rootimg_path=<os.img所在目录，如 /data/idv> \
        nomodeset console=tty0 quiet splash loglevel=3 \
        biosdevname=0 net.ifnames=0 consoleblank=0
    initrd /initrd.img

    boot
}

# 说明：
# - <BOOT分区UUID>：存放 vmlinuz/initrd 的分区（独立 /boot 或根分区）
# - <os.img所在分区UUID>：大镜像文件所在的数据分区
# - 两个 UUID 允许相同（内核和镜像放同一分区）
# - GRUB_DEFAULT 与 GRUB_TIMEOUT 通过 /etc/default/grub 或其 drop-in 目录调整，
#   可实现"默认进 WinVM Host、按住 Shift 进原生系统"的体验
